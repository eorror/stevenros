<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Buzz First</title>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #0f1020;
    --card: #1a1b33;
    --accent: #ff4757;
    --accent-dark: #c0392b;
    --green: #2ed573;
    --amber: #ffa502;
    --text: #f1f2f6;
    --muted: #9aa0b5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100dvh;
  }
  section { display: none; width: 100%; max-width: 560px; padding: 24px; flex: 1; flex-direction: column; }
  section.active { display: flex; }
  h1 { font-size: 2rem; text-align: center; margin: 24px 0 8px; letter-spacing: 1px; }
  .tagline { text-align: center; color: var(--muted); margin-bottom: 40px; }
  .btn {
    display: block; width: 100%; padding: 18px; font-size: 1.15rem; font-weight: 700;
    border: none; border-radius: 14px; cursor: pointer; color: #fff;
    background: var(--card); transition: transform .08s, filter .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); }
  .btn.ghost { background: transparent; border: 2px solid var(--card); color: var(--muted); font-weight: 500; }
  .btn + .btn { margin-top: 14px; }
  input {
    width: 100%; padding: 16px; font-size: 1.1rem; border-radius: 12px;
    border: 2px solid #2c2e52; background: var(--card); color: var(--text);
    margin-bottom: 14px; outline: none; text-align: center;
  }
  input:focus { border-color: var(--accent); }
  input.code { text-transform: uppercase; letter-spacing: .5em; font-weight: 700; font-size: 1.5rem; }
  label { color: var(--muted); font-size: .85rem; display: block; margin-bottom: 6px; text-align: center; }
  .error { color: var(--accent); text-align: center; min-height: 1.4em; margin-bottom: 10px; font-size: .95rem; }

  /* Host */
  .room-banner { text-align: center; margin-bottom: 18px; }
  .room-code { font-size: 3.2rem; font-weight: 800; letter-spacing: .35em; text-indent: .35em; color: var(--amber); }
  .room-hint { color: var(--muted); font-size: .9rem; }
  #qr { display: flex; justify-content: center; margin: 14px 0 20px; }
  #qr img, #qr canvas { border-radius: 10px; border: 8px solid #fff; }
  .players { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; min-height: 40px; }
  .chip {
    background: var(--card); padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: .95rem;
    border: 1px solid #2c2e52;
  }
  .chip.buzzed { background: var(--green); color: #08331a; border-color: var(--green); }
  #results { list-style: none; margin: 10px 0 20px; }
  #results li {
    display: flex; align-items: center; gap: 12px; background: var(--card);
    padding: 14px 18px; border-radius: 12px; margin-bottom: 8px; font-size: 1.1rem;
    animation: pop .25s ease;
  }
  #results li:first-child { background: var(--green); color: #08331a; font-weight: 800; }
  #results .place { font-size: 1.3rem; width: 2rem; }
  #results .ms { margin-left: auto; font-variant-numeric: tabular-nums; opacity: .8; font-size: .95rem; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .status { text-align: center; color: var(--muted); margin: 10px 0 16px; min-height: 1.4em; }
  .status.armed { color: var(--green); font-weight: 700; font-size: 1.2rem; }

  /* Player buzz button */
  .buzz-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #buzzBtn {
    width: min(75vw, 320px); height: min(75vw, 320px); border-radius: 50%;
    border: none; font-size: 2.4rem; font-weight: 900; color: #fff; letter-spacing: 2px;
    background: radial-gradient(circle at 30% 25%, #555a77, #2c2e52);
    box-shadow: 0 12px 0 #14152b, 0 20px 40px rgba(0,0,0,.5);
    cursor: pointer; transition: filter .15s;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  #buzzBtn.armed {
    background: radial-gradient(circle at 30% 25%, #ff6b81, var(--accent-dark));
    box-shadow: 0 12px 0 #7d1f16, 0 20px 60px rgba(255,71,87,.45);
    animation: pulse 1.2s infinite;
  }
  #buzzBtn:active { transform: translateY(8px); box-shadow: 0 4px 0 #14152b; }
  @keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }
  .place-big { font-size: 4rem; font-weight: 900; text-align: center; }
  .place-big small { display: block; font-size: 1.1rem; font-weight: 500; color: var(--muted); margin-top: 8px; }
  .you-room { text-align: center; color: var(--muted); margin-bottom: 6px; font-size: .9rem; }
</style>
</head>
<body>

<!-- HOME -->
<section id="view-home" class="active">
  <h1>🔴 Buzz First</h1>
  <p class="tagline">The fastest finger wins. No arguments.</p>
  <p class="error" id="homeError"></p>
  <button class="btn primary" id="hostBtn">Host a game</button>
  <button class="btn" id="joinShowBtn">Join with a code</button>
</section>

<!-- JOIN FORM -->
<section id="view-join">
  <h1>Join game</h1>
  <p class="tagline">Ask the host for the room code</p>
  <label>Room code</label>
  <input id="joinCode" class="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD">
  <label>Your name</label>
  <input id="joinName" maxlength="16" autocomplete="off" placeholder="Steven">
  <p class="error" id="joinError"></p>
  <button class="btn primary" id="joinBtn">Join</button>
  <button class="btn ghost" onclick="showView('view-home')">Back</button>
</section>

<!-- HOST -->
<section id="view-host">
  <div class="room-banner">
    <div class="room-hint">Room code</div>
    <div class="room-code" id="roomCode">····</div>
    <div class="room-hint">Scan to join</div>
  </div>
  <div id="qr"></div>
  <div class="players" id="playerChips"></div>
  <p class="status" id="hostStatus">Waiting for players to join…</p>
  <ol id="results"></ol>
  <button class="btn primary" id="armBtn" disabled>Start round</button>
  <button class="btn" id="resetBtn" style="display:none">Next round</button>
</section>

<!-- PLAYER -->
<section id="view-player">
  <p class="you-room" id="playerInfo"></p>
  <div class="buzz-wrap">
    <div id="playerResult" class="place-big" style="display:none"></div>
    <button id="buzzBtn" disabled>WAIT…</button>
  </div>
  <p class="status" id="playerStatus">Connected. Waiting for the host to start.</p>
</section>

<script>
const $ = id => document.getElementById(id);
const TOPIC_ROOT = 'buzzfirst';
const LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; // no I/O — avoids confusion

// All game traffic goes through a public MQTT broker over secure websockets.
// Every device only makes an outbound connection — no device-to-device
// networking — so it works on any wifi or cellular network that can load
// this page. If the first broker is down, the next one is tried.
const BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081',
];

function showView(id) {
  document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

function randomId() {
  return Math.random().toString(36).slice(2, 10);
}

function connectBroker(will) {
  return new Promise((resolve, reject) => {
    let i = 0;
    const tryNext = () => {
      if (i >= BROKERS.length) return reject(new Error('all-brokers-failed'));
      const client = mqtt.connect(BROKERS[i++], {
        keepalive: 15,
        connectTimeout: 5000,
        reconnectPeriod: 1500,
        clean: true,
        will: will || undefined,
      });
      let settled = false, moved = false;
      const giveUp = () => {
        if (settled || moved) return;
        moved = true;
        client.end(true);
        tryNext();
      };
      client.once('connect', () => { settled = true; resolve(client); });
      client.once('error', giveUp);
      setTimeout(giveUp, 6000);
    };
    tryNext();
  });
}

function beep(freq = 880, dur = 0.15) {
  try {
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch (e) { /* audio blocked until user gesture — fine */ }
}

// Keep phone screens awake during the game — a sleeping host kills the room.
async function keepAwake() {
  try {
    if (!navigator.wakeLock) return;
    keepAwake.lock = await navigator.wakeLock.request('screen');
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && keepAwake.lock?.released !== false) {
        try { keepAwake.lock = await navigator.wakeLock.request('screen'); } catch (e) {}
      }
    });
  } catch (e) { /* not supported or denied — fine */ }
}

/* ---------------- HOST ---------------- */
const host = {
  client: null,
  code: '',
  base: '',
  players: new Map(),  // pid -> { name }
  buzzes: [],          // { pid, name, elapsed }
  phase: 'lobby',      // lobby | armed

  async start() {
    $('hostBtn').disabled = true;
    $('homeError').textContent = '';
    this.code = Array.from({length: 4}, () => LETTERS[Math.floor(Math.random() * LETTERS.length)]).join('');
    this.base = TOPIC_ROOT + '/' + this.code;

    try {
      // Last-will lets players find out if the host device drops off abruptly.
      this.client = await connectBroker({
        topic: this.base + '/h2c',
        payload: JSON.stringify({ type: 'host-gone' }),
        qos: 0,
        retain: false,
      });
    } catch (e) {
      $('hostBtn').disabled = false;
      $('homeError').textContent = 'Can’t reach the game server. Check your internet connection and try again.';
      return;
    }

    this.client.subscribe(this.base + '/c2h/+', { qos: 1 });
    this.client.on('message', (topic, payload) => {
      const prefix = this.base + '/c2h/';
      if (!topic.startsWith(prefix)) return;
      let msg;
      try { msg = JSON.parse(payload.toString()); } catch (e) { return; }
      this.onMessage(topic.slice(prefix.length), msg);
    });

    $('roomCode').textContent = this.code;
    const url = location.origin + location.pathname + '?room=' + this.code;
    $('qr').innerHTML = '';
    new QRCode($('qr'), { text: url, width: 168, height: 168, correctLevel: QRCode.CorrectLevel.M });
    showView('view-host');
    keepAwake();
  },

  onMessage(pid, msg) {
    if (msg.type === 'join') {
      this.players.set(pid, { name: String(msg.name).slice(0, 16) });
      this.send(pid, { type: 'joined', phase: this.phase });
      this.renderPlayers();
    } else if (msg.type === 'leave') {
      if (this.players.delete(pid)) this.renderPlayers();
    } else if (msg.type === 'buzz' && this.phase === 'armed') {
      const p = this.players.get(pid);
      if (!p || this.buzzes.some(b => b.pid === pid)) return; // one buzz per round
      this.buzzes.push({ pid, name: p.name, elapsed: msg.elapsed });
      this.buzzes.sort((a, b) => a.elapsed - b.elapsed);
      beep(this.buzzes.length === 1 ? 1050 : 700);
      this.renderResults();
      this.broadcast({ type: 'standings', order: this.buzzes.map(b => ({ pid: b.pid, name: b.name, elapsed: b.elapsed })) });
    }
  },

  send(pid, msg) {
    this.client.publish(this.base + '/h2c/' + pid, JSON.stringify(msg), { qos: 1 });
  },

  broadcast(msg) {
    this.client.publish(this.base + '/h2c', JSON.stringify(msg), { qos: 1 });
  },

  arm() {
    this.phase = 'armed';
    this.buzzes = [];
    this.renderResults();
    this.broadcast({ type: 'armed' });
    $('hostStatus').textContent = 'GO! Waiting for buzzes…';
    $('hostStatus').classList.add('armed');
    $('armBtn').style.display = 'none';
    $('resetBtn').style.display = 'block';
  },

  reset() {
    this.phase = 'lobby';
    this.buzzes = [];
    this.broadcast({ type: 'reset' });
    this.renderResults();
    $('hostStatus').textContent = 'Ready when you are.';
    $('hostStatus').classList.remove('armed');
    $('armBtn').style.display = 'block';
    $('resetBtn').style.display = 'none';
  },

  renderPlayers() {
    const chips = $('playerChips');
    chips.innerHTML = '';
    this.players.forEach(({ name }, pid) => {
      const el = document.createElement('span');
      el.className = 'chip' + (this.buzzes.some(b => b.pid === pid) ? ' buzzed' : '');
      el.textContent = name;
      chips.appendChild(el);
    });
    $('armBtn').disabled = this.players.size === 0;
    if (this.phase === 'lobby') {
      $('hostStatus').textContent = this.players.size === 0
        ? 'Waiting for players to join…'
        : this.players.size + ' player' + (this.players.size > 1 ? 's' : '') + ' in. Ready when you are.';
    }
  },

  renderResults() {
    const medals = ['🥇', '🥈', '🥉'];
    $('results').innerHTML = this.buzzes.map((b, i) => {
      const delta = i === 0 ? (b.elapsed / 1000).toFixed(3) + 's' : '+' + Math.round(b.elapsed - this.buzzes[0].elapsed) + 'ms';
      return `<li><span class="place">${medals[i] || (i + 1) + '.'}</span> ${b.name} <span class="ms">${delta}</span></li>`;
    }).join('');
    this.renderPlayers();
  },
};

/* ---------------- PLAYER ---------------- */
const player = {
  client: null,
  pid: '',
  base: '',
  name: '',
  joined: false,
  armedAt: null,
  buzzed: false,

  async join(code, name) {
    this.progress('Connecting to game server…');
    $('joinBtn').disabled = true;
    this.pid = randomId();
    this.name = name;
    this.base = TOPIC_ROOT + '/' + code;

    try {
      // Last-will removes this player from the host's list if the phone drops off.
      this.client = await connectBroker({
        topic: this.base + '/c2h/' + this.pid,
        payload: JSON.stringify({ type: 'leave' }),
        qos: 0,
        retain: false,
      });
    } catch (e) {
      return this.fail('Can’t reach the game server. Check your internet connection and try again.');
    }

    this.progress('Looking for the room…');
    this.client.subscribe([this.base + '/h2c', this.base + '/h2c/' + this.pid], { qos: 1 });
    const timeout = setTimeout(() => {
      if (!this.joined) this.fail('Room not found. Check the code — the room closes when the host leaves the page.');
    }, 10000);

    this.client.on('message', (topic, payload) => {
      let msg;
      try { msg = JSON.parse(payload.toString()); } catch (e) { return; }
      if (msg.type === 'joined' && !this.joined) {
        this.joined = true;
        clearTimeout(timeout);
        $('playerInfo').textContent = name + ' · room ' + code;
        showView('view-player');
        keepAwake();
      }
      this.onMessage(msg);
    });

    this.send({ type: 'join', name });
  },

  progress(text) {
    const el = $('joinError');
    el.style.color = 'var(--muted)';
    el.textContent = text;
  },

  fail(text) {
    const el = $('joinError');
    el.style.color = '';
    el.textContent = text;
    $('joinBtn').disabled = false;
    this.joined = false;
    if (this.client) { this.client.end(true); this.client = null; }
  },

  send(msg) {
    this.client.publish(this.base + '/c2h/' + this.pid, JSON.stringify(msg), { qos: 1 });
  },

  onMessage(msg) {
    if (msg.type === 'armed') {
      this.armedAt = performance.now();
      this.buzzed = false;
      $('playerResult').style.display = 'none';
      this.setButton('armed');
      $('playerStatus').textContent = '';
      beep(660, 0.1);
    } else if (msg.type === 'reset') {
      this.armedAt = null;
      this.buzzed = false;
      $('playerResult').style.display = 'none';
      this.setButton('wait');
      $('playerStatus').textContent = 'Waiting for the host to start.';
    } else if (msg.type === 'standings' && this.buzzed) {
      const idx = msg.order.findIndex(o => o.pid === this.pid);
      if (idx >= 0) {
        const medals = ['🥇 First!', '🥈 2nd', '🥉 3rd'];
        $('playerResult').innerHTML = (medals[idx] || '#' + (idx + 1)) +
          `<small>${Math.round(msg.order[idx].elapsed)}ms reaction</small>`;
        $('playerResult').style.display = 'block';
      }
    } else if (msg.type === 'host-gone') {
      this.armedAt = null;
      this.setButton('wait');
      $('playerStatus').textContent = 'The host left the room.';
    }
  },

  buzz() {
    if (this.armedAt === null || this.buzzed) return;
    const elapsed = performance.now() - this.armedAt;
    this.buzzed = true;
    this.send({ type: 'buzz', elapsed });
    this.setButton('buzzed');
    beep(1050, 0.2);
  },

  setButton(state) {
    const btn = $('buzzBtn');
    btn.classList.toggle('armed', state === 'armed');
    btn.disabled = state !== 'armed';
    btn.textContent = state === 'armed' ? 'BUZZ!' : state === 'buzzed' ? 'BUZZED' : 'WAIT…';
  },
};

/* ---------------- Wiring ---------------- */
$('hostBtn').onclick = () => { beep(1, 0.01); host.start(); };
$('joinShowBtn').onclick = () => showView('view-join');
$('joinBtn').onclick = () => {
  const code = $('joinCode').value.trim().toUpperCase();
  const name = $('joinName').value.trim();
  if (code.length !== 4) return $('joinError').textContent = 'Code is 4 letters.';
  if (!name) return $('joinError').textContent = 'Enter your name.';
  beep(1, 0.01);
  player.join(code, name);
};
$('armBtn').onclick = () => host.arm();
$('resetBtn').onclick = () => host.reset();
$('buzzBtn').addEventListener('pointerdown', () => player.buzz());

// Tell the room when this device leaves the page gracefully.
window.addEventListener('pagehide', () => {
  try {
    if (player.client && player.joined) { player.send({ type: 'leave' }); player.client.end(); }
    if (host.client) { host.broadcast({ type: 'host-gone' }); host.client.end(); }
  } catch (e) {}
});

// Deep link: ?room=ABCD pre-fills the join form
const roomParam = new URLSearchParams(location.search).get('room');
if (roomParam) {
  $('joinCode').value = roomParam.toUpperCase();
  showView('view-join');
  $('joinName').focus();
}
</script>
</body>
</html>
