<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Buzz First</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #0f1020;
    --card: #1a1b33;
    --accent: #ff4757;
    --accent-dark: #c0392b;
    --green: #2ed573;
    --amber: #ffa502;
    --text: #f1f2f6;
    --muted: #9aa0b5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100dvh;
  }
  section { display: none; width: 100%; max-width: 560px; padding: 24px; flex: 1; flex-direction: column; }
  section.active { display: flex; }
  h1 { font-size: 2rem; text-align: center; margin: 24px 0 8px; letter-spacing: 1px; }
  .tagline { text-align: center; color: var(--muted); margin-bottom: 40px; }
  .btn {
    display: block; width: 100%; padding: 18px; font-size: 1.15rem; font-weight: 700;
    border: none; border-radius: 14px; cursor: pointer; color: #fff;
    background: var(--card); transition: transform .08s, filter .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); }
  .btn.ghost { background: transparent; border: 2px solid var(--card); color: var(--muted); font-weight: 500; }
  .btn + .btn { margin-top: 14px; }
  input {
    width: 100%; padding: 16px; font-size: 1.1rem; border-radius: 12px;
    border: 2px solid #2c2e52; background: var(--card); color: var(--text);
    margin-bottom: 14px; outline: none; text-align: center;
  }
  input:focus { border-color: var(--accent); }
  input.code { text-transform: uppercase; letter-spacing: .5em; font-weight: 700; font-size: 1.5rem; }
  label { color: var(--muted); font-size: .85rem; display: block; margin-bottom: 6px; text-align: center; }
  .error { color: var(--accent); text-align: center; min-height: 1.4em; margin-bottom: 10px; font-size: .95rem; }

  /* Host */
  .room-banner { text-align: center; margin-bottom: 18px; }
  .room-code { font-size: 3.2rem; font-weight: 800; letter-spacing: .35em; text-indent: .35em; color: var(--amber); }
  .room-hint { color: var(--muted); font-size: .9rem; }
  #qr { display: flex; justify-content: center; margin: 14px 0 20px; }
  #qr img, #qr canvas { border-radius: 10px; border: 8px solid #fff; }
  .players { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; min-height: 40px; }
  .chip {
    background: var(--card); padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: .95rem;
    border: 1px solid #2c2e52;
  }
  .chip.buzzed { background: var(--green); color: #08331a; border-color: var(--green); }
  #results { list-style: none; margin: 10px 0 20px; }
  #results li {
    display: flex; align-items: center; gap: 12px; background: var(--card);
    padding: 14px 18px; border-radius: 12px; margin-bottom: 8px; font-size: 1.1rem;
    animation: pop .25s ease;
  }
  #results li:first-child { background: var(--green); color: #08331a; font-weight: 800; }
  #results .place { font-size: 1.3rem; width: 2rem; }
  #results .ms { margin-left: auto; font-variant-numeric: tabular-nums; opacity: .8; font-size: .95rem; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .status { text-align: center; color: var(--muted); margin: 10px 0 16px; min-height: 1.4em; }
  .status.armed { color: var(--green); font-weight: 700; font-size: 1.2rem; }

  /* Player buzz button */
  .buzz-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #buzzBtn {
    width: min(75vw, 320px); height: min(75vw, 320px); border-radius: 50%;
    border: none; font-size: 2.4rem; font-weight: 900; color: #fff; letter-spacing: 2px;
    background: radial-gradient(circle at 30% 25%, #555a77, #2c2e52);
    box-shadow: 0 12px 0 #14152b, 0 20px 40px rgba(0,0,0,.5);
    cursor: pointer; transition: filter .15s;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  #buzzBtn.armed {
    background: radial-gradient(circle at 30% 25%, #ff6b81, var(--accent-dark));
    box-shadow: 0 12px 0 #7d1f16, 0 20px 60px rgba(255,71,87,.45);
    animation: pulse 1.2s infinite;
  }
  #buzzBtn:active { transform: translateY(8px); box-shadow: 0 4px 0 #14152b; }
  @keyframes pulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.25); } }
  .place-big { font-size: 4rem; font-weight: 900; text-align: center; }
  .place-big small { display: block; font-size: 1.1rem; font-weight: 500; color: var(--muted); margin-top: 8px; }
  .you-room { text-align: center; color: var(--muted); margin-bottom: 6px; font-size: .9rem; }
</style>
</head>
<body>

<!-- HOME -->
<section id="view-home" class="active">
  <h1>🔴 Buzz First</h1>
  <p class="tagline">The fastest finger wins. No arguments.</p>
  <button class="btn primary" id="hostBtn">Host a game</button>
  <button class="btn" id="joinShowBtn">Join with a code</button>
</section>

<!-- JOIN FORM -->
<section id="view-join">
  <h1>Join game</h1>
  <p class="tagline">Ask the host for the room code</p>
  <label>Room code</label>
  <input id="joinCode" class="code" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="ABCD">
  <label>Your name</label>
  <input id="joinName" maxlength="16" autocomplete="off" placeholder="Steven">
  <p class="error" id="joinError"></p>
  <button class="btn primary" id="joinBtn">Join</button>
  <button class="btn ghost" onclick="showView('view-home')">Back</button>
</section>

<!-- HOST -->
<section id="view-host">
  <div class="room-banner">
    <div class="room-hint">Room code</div>
    <div class="room-code" id="roomCode">····</div>
    <div class="room-hint">Scan to join</div>
  </div>
  <div id="qr"></div>
  <div class="players" id="playerChips"></div>
  <p class="status" id="hostStatus">Waiting for players to join…</p>
  <ol id="results"></ol>
  <button class="btn primary" id="armBtn" disabled>Start round</button>
  <button class="btn" id="resetBtn" style="display:none">Next round</button>
</section>

<!-- PLAYER -->
<section id="view-player">
  <p class="you-room" id="playerInfo"></p>
  <div class="buzz-wrap">
    <div id="playerResult" class="place-big" style="display:none"></div>
    <button id="buzzBtn" disabled>WAIT…</button>
  </div>
  <p class="status" id="playerStatus">Connected. Waiting for the host to start.</p>
</section>

<script>
const $ = id => document.getElementById(id);
const PREFIX = 'buzzfirst-room-';
const LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; // no I/O — avoids confusion

function showView(id) {
  document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}

function beep(freq = 880, dur = 0.15) {
  try {
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch (e) { /* audio blocked until user gesture — fine */ }
}

/* ---------------- HOST ---------------- */
const host = {
  peer: null,
  conns: new Map(),   // peerId -> { conn, name }
  buzzes: [],         // { name, elapsed }
  phase: 'lobby',     // lobby | armed

  start() {
    const code = Array.from({length: 4}, () => LETTERS[Math.floor(Math.random() * LETTERS.length)]).join('');
    this.peer = new Peer(PREFIX + code, { debug: 1 });

    this.peer.on('open', () => {
      $('roomCode').textContent = code;
      const url = location.origin + location.pathname + '?room=' + code;
      $('qr').innerHTML = '';
      new QRCode($('qr'), { text: url, width: 168, height: 168, correctLevel: QRCode.CorrectLevel.M });
      showView('view-host');
    });

    this.peer.on('error', err => {
      if (err.type === 'unavailable-id') this.start(); // code collision — roll a new one
      else $('hostStatus').textContent = 'Connection error: ' + err.type;
    });

    this.peer.on('connection', conn => {
      conn.on('data', msg => this.onMessage(conn, msg));
      conn.on('close', () => this.dropPlayer(conn.peer));
      conn.on('error', () => this.dropPlayer(conn.peer));
    });
  },

  onMessage(conn, msg) {
    if (msg.type === 'join') {
      this.conns.set(conn.peer, { conn, name: String(msg.name).slice(0, 16) });
      conn.send({ type: 'joined', phase: this.phase });
      this.renderPlayers();
    } else if (msg.type === 'buzz' && this.phase === 'armed') {
      const p = this.conns.get(conn.peer);
      if (!p || this.buzzes.some(b => b.peer === conn.peer)) return; // one buzz per round
      this.buzzes.push({ peer: conn.peer, name: p.name, elapsed: msg.elapsed });
      this.buzzes.sort((a, b) => a.elapsed - b.elapsed);
      beep(this.buzzes.length === 1 ? 1050 : 700);
      this.renderResults();
      this.broadcastStandings();
    }
  },

  dropPlayer(peerId) {
    if (this.conns.delete(peerId)) this.renderPlayers();
  },

  broadcast(msg) {
    this.conns.forEach(({ conn }) => { if (conn.open) conn.send(msg); });
  },

  broadcastStandings() {
    this.broadcast({ type: 'standings', order: this.buzzes.map(b => ({ peer: b.peer, name: b.name, elapsed: b.elapsed })) });
  },

  arm() {
    this.phase = 'armed';
    this.buzzes = [];
    this.renderResults();
    this.renderPlayers();
    this.broadcast({ type: 'armed' });
    $('hostStatus').textContent = 'GO! Waiting for buzzes…';
    $('hostStatus').classList.add('armed');
    $('armBtn').style.display = 'none';
    $('resetBtn').style.display = 'block';
  },

  reset() {
    this.phase = 'lobby';
    this.buzzes = [];
    this.broadcast({ type: 'reset' });
    this.renderResults();
    this.renderPlayers();
    $('hostStatus').textContent = 'Ready when you are.';
    $('hostStatus').classList.remove('armed');
    $('armBtn').style.display = 'block';
    $('resetBtn').style.display = 'none';
  },

  renderPlayers() {
    const chips = $('playerChips');
    chips.innerHTML = '';
    this.conns.forEach(({ name }, peerId) => {
      const el = document.createElement('span');
      el.className = 'chip' + (this.buzzes.some(b => b.peer === peerId) ? ' buzzed' : '');
      el.textContent = name;
      chips.appendChild(el);
    });
    $('armBtn').disabled = this.conns.size === 0;
    if (this.phase === 'lobby') {
      $('hostStatus').textContent = this.conns.size === 0
        ? 'Waiting for players to join…'
        : this.conns.size + ' player' + (this.conns.size > 1 ? 's' : '') + ' in. Ready when you are.';
    }
  },

  renderResults() {
    const medals = ['🥇', '🥈', '🥉'];
    $('results').innerHTML = this.buzzes.map((b, i) => {
      const delta = i === 0 ? (b.elapsed / 1000).toFixed(3) + 's' : '+' + Math.round(b.elapsed - this.buzzes[0].elapsed) + 'ms';
      return `<li><span class="place">${medals[i] || (i + 1) + '.'}</span> ${b.name} <span class="ms">${delta}</span></li>`;
    }).join('');
    this.renderPlayers();
  },
};

/* ---------------- PLAYER ---------------- */
const player = {
  peer: null,
  conn: null,
  armedAt: null,
  buzzed: false,

  join(code, name) {
    $('joinError').textContent = '';
    $('joinBtn').disabled = true;
    this.name = name;
    this.peer = new Peer({ debug: 1 });

    this.peer.on('open', () => {
      this.conn = this.peer.connect(PREFIX + code, { reliable: true });
      const timeout = setTimeout(() => this.fail('Room not found. Check the code.'), 8000);

      this.conn.on('open', () => {
        this.conn.send({ type: 'join', name });
      });
      this.conn.on('data', msg => {
        if (msg.type === 'joined') {
          clearTimeout(timeout);
          $('playerInfo').textContent = name + ' · room ' + code;
          showView('view-player');
        }
        this.onMessage(msg);
      });
      this.conn.on('close', () => {
        $('playerStatus').textContent = 'Disconnected from host.';
        this.setButton('wait');
      });
    });
    this.peer.on('error', err => {
      if (err.type === 'peer-unavailable') this.fail('Room not found. Check the code.');
      else this.fail('Connection error: ' + err.type);
    });
  },

  fail(text) {
    $('joinError').textContent = text;
    $('joinBtn').disabled = false;
    if (this.peer) { this.peer.destroy(); this.peer = null; }
  },

  onMessage(msg) {
    if (msg.type === 'armed') {
      this.armedAt = performance.now();
      this.buzzed = false;
      $('playerResult').style.display = 'none';
      this.setButton('armed');
      $('playerStatus').textContent = '';
      beep(660, 0.1);
    } else if (msg.type === 'reset') {
      this.armedAt = null;
      this.buzzed = false;
      $('playerResult').style.display = 'none';
      this.setButton('wait');
      $('playerStatus').textContent = 'Waiting for the host to start.';
    } else if (msg.type === 'standings' && this.buzzed) {
      const idx = msg.order.findIndex(o => o.peer === this.peer.id);
      if (idx >= 0) {
        const medals = ['🥇 First!', '🥈 2nd', '🥉 3rd'];
        $('playerResult').innerHTML = (medals[idx] || '#' + (idx + 1)) +
          `<small>${Math.round(msg.order[idx].elapsed)}ms reaction</small>`;
        $('playerResult').style.display = 'block';
      }
    }
  },

  buzz() {
    if (this.armedAt === null || this.buzzed) return;
    const elapsed = performance.now() - this.armedAt;
    this.buzzed = true;
    this.conn.send({ type: 'buzz', elapsed });
    this.setButton('buzzed');
    beep(1050, 0.2);
  },

  setButton(state) {
    const btn = $('buzzBtn');
    btn.classList.toggle('armed', state === 'armed');
    btn.disabled = state !== 'armed';
    btn.textContent = state === 'armed' ? 'BUZZ!' : state === 'buzzed' ? 'BUZZED' : 'WAIT…';
  },
};

/* ---------------- Wiring ---------------- */
$('hostBtn').onclick = () => { beep(1, 0.01); host.start(); };
$('joinShowBtn').onclick = () => showView('view-join');
$('joinBtn').onclick = () => {
  const code = $('joinCode').value.trim().toUpperCase();
  const name = $('joinName').value.trim();
  if (code.length !== 4) return $('joinError').textContent = 'Code is 4 letters.';
  if (!name) return $('joinError').textContent = 'Enter your name.';
  beep(1, 0.01);
  player.join(code, name);
};
$('armBtn').onclick = () => host.arm();
$('resetBtn').onclick = () => host.reset();
$('buzzBtn').addEventListener('pointerdown', () => player.buzz());

// Deep link: ?room=ABCD pre-fills the join form
const roomParam = new URLSearchParams(location.search).get('room');
if (roomParam) {
  $('joinCode').value = roomParam.toUpperCase();
  showView('view-join');
  $('joinName').focus();
}
</script>
</body>
</html>
