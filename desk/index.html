<!DOCTYPE html>
<html lang="en-NZ" data-theme="light" data-accent="Vermilion">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Desk: ideas, to-dos, calendar, mail and money in one calm place.">
<meta name="theme-color" content="#FAF8F4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Desk">
<title>Desk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script>
  // Set the theme before first paint so dark mode doesn't flash.
  try {
    var s = JSON.parse(localStorage.getItem('desk.v1') || '{}');
    var dark = s.theme === 'dark' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (s.accent) document.documentElement.dataset.accent = s.accent;
  } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<noscript>Desk needs JavaScript turned on.</noscript>
<script src="app.js"></script>
</body>
</html>
